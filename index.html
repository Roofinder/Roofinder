const MessageModal = ({roofer, user, onClose, onSignup}) => {
  const [step, setStep] = useState(user ? "message" : "signup");
  const [name, setName] = useState("");
  const [email, setEmail] = useState("");
  const [msg, setMsg] = useState("");
  const [sent, setSent] = useState(false);
  const handleSignup = () => { if(!name.trim()||!email.trim()) return; onSignup({name:name.trim(),email:email.trim()}); setStep("message"); };
  const handleSend = async () => {
    if(!msg.trim()) return;
    try {
      await fetch("https://formspree.io/f/xnjroolp", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
          contractor: roofer.name,
          location: roofer.location,
          from_name: user?.name || name,
          from_email: user?.email || email,
          message: msg,
          _subject: `New RooFinder Lead — ${roofer.name}`,
        }),
      });
    } catch(e) { console.log(e); }
    setSent(true);
  };
  return (
    <div onClick={onClose} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.65)",zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center",padding:24}}>
      <div onClick={e=>e.stopPropagation()} style={{background:"#fff",borderRadius:16,width:"100%",maxWidth:420,boxShadow:"0 24px 60px rgba(0,0,0,0.3)",overflow:"hidden"}}>
        <div style={{background:"#1A1A1A",padding:"16px 20px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div><div style={{color:"#fff",fontWeight:700,fontSize:15}}>{roofer.name}</div><div style={{color:"#9CA3AF",fontSize:12}}>{roofer.location}</div></div>
          <button onClick={onClose} style={{background:"none",border:"none",color:"#9CA3AF",fontSize:22,cursor:"pointer"}}>×</button>
        </div>
        <div style={{padding:24}}>
          {sent ? (
            <div style={{textAlign:"center",padding:"16px 0"}}>
              <div style={{fontSize:44,marginBottom:10}}>✅</div>
              <div style={{fontSize:17,fontWeight:700,color:"#111",marginBottom:8}}>Message Sent!</div>
              <div style={{color:"#6B7280",fontSize:13,lineHeight:1.6,marginBottom:16}}>{roofer.name} will reply through RooFinder. No cold calls unless you want them.</div>
              <button onClick={onClose} style={{background:"#C8102E",color:"#fff",border:"none",borderRadius:8,padding:"11px 32px",fontSize:14,fontWeight:700,cursor:"pointer"}}>Done</button>
            </div>
          ) : step==="signup" ? (
            <>
              <div style={{fontSize:16,fontWeight:700,color:"#111",marginBottom:6}}>Quick account to send message</div>
              <div style={{color:"#6B7280",fontSize:13,lineHeight:1.6,marginBottom:16}}>Just name + email. No phone required. They reply here — <strong>no cold calls.</strong></div>
              <div style={{display:"flex",flexDirection:"column",gap:10,marginBottom:14}}>
                <input value={name} onChange={e=>setName(e.target.value)} placeholder="Your first name" style={{padding:"11px 14px",border:"1.5px solid #E5E0D8",borderRadius:8,fontSize:14,outline:"none",color:"#111"}}/>
                <input value={email} onChange={e=>setEmail(e.target.value)} placeholder="Email address" type="email" style={{padding:"11px 14px",border:"1.5px solid #E5E0D8",borderRadius:8,fontSize:14,outline:"none",color:"#111"}}/>
              </div>
              <button onClick={handleSignup} disabled={!name.trim()||!email.trim()} style={{width:"100%",background:name.trim()&&email.trim()?"#C8102E":"#E5E0D8",color:name.trim()&&email.trim()?"#fff":"#9CA3AF",border:"none",borderRadius:8,padding:"12px",fontSize:15,fontWeight:700,cursor:"pointer"}}>Continue →</button>
              <div style={{textAlign:"center",marginTop:10,color:"#9CA3AF",fontSize:11}}>🔒 We never sell your info</div>
            </>
          ) : (
            <>
              <div style={{fontSize:15,fontWeight:700,color:"#111",marginBottom:4}}>Message {roofer.name}</div>
              <div style={{color:"#6B7280",fontSize:13,marginBottom:12}}>They reply through RooFinder — no calls unless you want them.</div>
              <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:12}}>
                {["I think I have storm damage","I need a free inspection","I'd like a quote","I need emergency repair"].map(p=>(
                  <button key={p} onClick={()=>setMsg(p)} style={{background:msg===p?"#FEF2F2":"#F7F5F0",border:`1px solid ${msg===p?"#C8102E":"#E5E0D8"}`,color:msg===p?"#C8102E":"#4B4B4B",borderRadius:20,padding:"5px 10px",fontSize:11,cursor:"pointer"}}>{p}</button>
                ))}
              </div>
              <textarea value={msg} onChange={e=>setMsg(e.target.value)} placeholder="Add any details..." rows={3} style={{width:"100%",padding:"11px 14px",border:"1.5px solid #E5E0D8",borderRadius:8,fontSize:13,resize:"none",outline:"none",color:"#111",boxSizing:"border-box"}}/>
              <button onClick={handleSend} disabled={!msg.trim()} style={{width:"100%",marginTop:10,background:msg.trim()?"#C8102E":"#E5E0D8",color:msg.trim()?"#fff":"#9CA3AF",border:"none",borderRadius:8,padding:"12px",fontSize:15,fontWeight:700,cursor:"pointer"}}>Send Message</button>
              <div style={{textAlign:"center",marginTop:8,color:"#9CA3AF",fontSize:11}}>🔒 Your phone is never shared unless you choose</div>
            </>
          )}
        </div>
      </div>
    </div>
  );
};

const urgentSteps = [
  {key:"issue",question:"What's going on with your roof?",subtitle:"Pick the option that best describes your situation",options:[{label:"🌩️ Storm Damage",desc:"Hail, wind, or water damage"},{label:"🔧 Repair Needed",desc:"Leak, missing shingles, or damage"},{label:"🏠 Full Replacement",desc:"Old roof or major damage"},{label:"🔍 Inspection",desc:"Want someone to take a look"}]},
  {key:"insurance",question:"Will you be using insurance?",subtitle:"This helps us match you with the right contractor",options:[{label:"✅ Yes — filing a claim",desc:"I want help with the insurance process"},{label:"💳 No — paying out of pocket",desc:"I'll be paying directly"},{label:"🤔 Not sure yet",desc:"I need to find out if I'm covered"}]},
  {key:"timeline",question:"How soon do you need this done?",subtitle:"We'll prioritize accordingly",options:[{label:"🚨 Emergency — today",desc:"Active leak or major damage"},{label:"📅 This week",desc:"Soon but not emergency"},{label:"🗓️ Within a month",desc:"Planning ahead"},{label:"⏳ Just getting quotes",desc:"No rush, exploring options"}]},
  {key:"contact",question:"How would you like to be contacted?",subtitle:"You control this — pick what's comfortable",options:[{label:"💬 Text message",desc:"Quick and easy"},{label:"📧 Email only",desc:"No calls, ever"},{label:"📞 Phone call is fine",desc:"I'm okay with a call"},{label:"📱 Any of the above",desc:"Whatever's fastest"}]},
];

const UrgentFlow = ({onBack}) => {
  const [step,setStep] = useState(0);
  const [answers,setAnswers] = useState({});
  const [name,setName] = useState("");
  const [email,setEmail] = useState("");
  const [zip,setZip] = useState("");
  const [phone,setPhone] = useState("");
  const [submitted,setSubmitted] = useState(false);
  const current = urgentSteps[step];
  const isLast = step===urgentSteps.length-1;
  const handleOption = (label) => { const a={...answers,[current.key]:label}; setAnswers(a); if(!isLast) setTimeout(()=>setStep(step+1),220); };
  const allAnswered = Object.keys(answers).length===urgentSteps.length;
  if(submitted) return (
    <div style={{maxWidth:520,margin:"0 auto",padding:"60px 24px",textAlign:"center"}}>
      <div style={{fontSize:56,marginBottom:16}}>🎉</div>
      <h2 style={{fontSize:24,fontWeight:700,color:"#111",marginBottom:10}}>You're all set!</h2>
      <p style={{color:"#6B7280",fontSize:15,lineHeight:1.7,marginBottom:24}}>We're matching you with verified roofers based on your needs. They'll reach out via your preferred contact method — no surprises.</p>
      <button onClick={onBack} style={{background:"#C8102E",color:"#fff",border:"none",borderRadius:8,padding:"12px 32px",fontSize:14,fontWeight:700,cursor:"pointer"}}>Browse Contractors</button>
    </div>
  );
  const wantsText = answers.contact && (answers.contact.includes("Text") || answers.contact.includes("Phone") || answers.contact.includes("Any"));
  const canSubmit = name.trim() && email.trim() && zip.trim() && (!wantsText || phone.trim());
  if(allAnswered) return (
    <div style={{maxWidth:480,margin:"0 auto",padding:"40px 24px"}}>
      <button onClick={()=>{setStep(3);const a={...answers};delete a.contact;setAnswers(a);}} style={{background:"none",border:"none",color:"#9CA3AF",fontSize:13,cursor:"pointer",marginBottom:24,padding:0}}>← Back</button>
      <h2 style={{fontSize:22,fontWeight:700,color:"#111",marginBottom:6}}>Almost done</h2>
      <p style={{color:"#6B7280",fontSize:14,marginBottom:24,lineHeight:1.6}}>Last step — where should contractors reach you? No spam. You're in control.</p>
      <div style={{display:"flex",flexDirection:"column",gap:12,marginBottom:20}}>
        <input value={name} onChange={e=>setName(e.target.value)} placeholder="Your first name" style={{padding:"12px 14px",border:"1.5px solid #E5E0D8",borderRadius:8,fontSize:14,outline:"none",color:"#111"}}/>
        <input value={email} onChange={e=>setEmail(e.target.value)} placeholder="Email address" type="email" style={{padding:"12px 14px",border:"1.5px solid #E5E0D8",borderRadius:8,fontSize:14,outline:"none",color:"#111"}}/>
        {wantsText && (
          <input value={phone} onChange={e=>setPhone(e.target.value)} placeholder="Phone number" type="tel" style={{padding:"12px 14px",border:"1.5px solid #C8102E",borderRadius:8,fontSize:14,outline:"none",color:"#111",background:"#FEF2F2"}}/>
        )}
        <input value={zip} onChange={e=>setZip(e.target.value)} placeholder="Zip code" style={{padding:"12px 14px",border:"1.5px solid #E5E0D8",borderRadius:8,fontSize:14,outline:"none",color:"#111"}}/>
      </div>
      {wantsText && (
        <div style={{background:"#FEF2F2",border:"1px solid #FECACA",borderRadius:8,padding:"10px 14px",marginBottom:16,fontSize:12,color:"#991B1B"}}>
          🔒 Your number is only shared with the contractor you choose — never sold or spammed.
        </div>
      )}
      <button onClick={()=>setSubmitted(true)} disabled={!canSubmit} style={{width:"100%",background:canSubmit?"#C8102E":"#E5E0D8",color:canSubmit?"#fff":"#9CA3AF",border:"none",borderRadius:8,padding:"14px",fontSize:16,fontWeight:700,cursor:canSubmit?"pointer":"default"}}>Find Me a Contractor →</button>
    </div>
  );
  return (
    <div style={{maxWidth:480,margin:"0 auto",padding:"40px 24px"}}>
      {step>0&&<button onClick={()=>setStep(step-1)} style={{background:"none",border:"none",color:"#9CA3AF",fontSize:13,cursor:"pointer",marginBottom:24,padding:0}}>← Back</button>}
      <div style={{background:"#F0EDE8",borderRadius:20,height:4,marginBottom:28}}><div style={{background:"#C8102E",borderRadius:20,height:4,width:`${((step+1)/urgentSteps.length)*100}%`,transition:"width 0.3s"}}/></div>
      <div style={{fontSize:11,color:"#C8102E",fontWeight:700,letterSpacing:"1px",marginBottom:8}}>STEP {step+1} OF {urgentSteps.length}</div>
      <h2 style={{fontSize:22,fontWeight:700,color:"#111",marginBottom:6}}>{current.question}</h2>
      <p style={{color:"#6B7280",fontSize:14,marginBottom:24,lineHeight:1.5}}>{current.subtitle}</p>
      <div style={{display:"flex",flexDirection:"column",gap:10}}>
        {current.options.map(opt=>{
          const selected=answers[current.key]===opt.label;
          return <button key={opt.label} onClick={()=>handleOption(opt.label)} style={{background:selected?"#FEF2F2":"#fff",border:`2px solid ${selected?"#C8102E":"#E5E0D8"}`,borderRadius:10,padding:"14px 16px",display:"flex",alignItems:"center",gap:14,cursor:"pointer",textAlign:"left",transition:"all 0.15s"}}>
            <div style={{fontSize:22}}>{opt.label.split(" ")[0]}</div>
            <div><div style={{fontSize:14,fontWeight:700,color:selected?"#C8102E":"#111"}}>{opt.label.split(" ").slice(1).join(" ")}</div><div style={{fontSize:12,color:"#9CA3AF",marginTop:2}}>{opt.desc}</div></div>
            {selected&&<div style={{marginLeft:"auto",color:"#C8102E",fontSize:18}}>✓</div>}
          </button>;
        })}
      </div>
    </div>
  );
};

function App() {
  const [tab,setTab] = useState("landing");
  const [user,setUser] = useState(null);
  const [showUserMenu,setShowUserMenu] = useState(false);
  if(tab==="landing") return <LandingPage onBrowse={()=>setTab("browse")} onUrgent={()=>setTab("urgent")} onPro={()=>setTab("pro")}/>;
  if(tab==="about") return (
    <div style={{minHeight:"100vh",background:"#F7F5F0"}}>
      <div style={{background:"#1A1A1A",padding:"0 24px"}}>
        <div style={{maxWidth:1000,margin:"0 auto",display:"flex",alignItems:"center",justifyContent:"space-between",padding:"12px 0"}}>
          <button onClick={()=>setTab("landing")} style={{display:"flex",alignItems:"center",gap:10,background:"none",border:"none",cursor:"pointer",padding:0}}>
            <LogoIcon size={44}/>

    <div style={{minHeight:"100vh",background:"#F7F5F0"}}>

            <LogoIcon size={44}/>
            <span style={{fontFamily:"'Bebas Neue','Georgia',serif",fontSize:26,letterSpacing:"1px",color:"#fff",lineHeight:1}}>Roo<span style={{color:"#C8102E"}}>Finder</span></span>
          </button>
          <div style={{width:44}}/>
        </div>
      </div>
      <PrivacyPage onBack={()=>setTab("landing")}/>
    </div>
  );
  if(tab==="pro") return (
    <div style={{minHeight:"100vh",background:"#F7F5F0"}}>
      <div style={{background:"#1A1A1A",padding:"0 24px",position:"sticky",top:0,zIndex:100,boxShadow:"0 2px 20px rgba(0,0,0,0.3)"}}>
        <div style={{maxWidth:1000,margin:"0 auto",display:"flex",alignItems:"center",justifyContent:"space-between",padding:"12px 0"}}>

            <LogoIcon size={44}/>
            <span style={{fontFamily:"'Bebas Neue','Georgia',serif",fontSize:26,letterSpacing:"1px",color:"#fff",lineHeight:1}}>Roo<span style={{color:"#C8102E"}}>Finder</span></span>
          </button>
          <div style={{color:"#9CA3AF",fontSize:13,fontFamily:"sans-serif"}}>🏠 Contractor Application</div>
          <div style={{width:44}}/>

            <button onClick={()=>setTab("urgent")} style={{padding:"7px 14px",borderRadius:7,border:"none",background:tab==="urgent"?"#C8102E":"transparent",color:tab==="urgent"?"#fff":"#9CA3AF",fontSize:12,fontWeight:tab==="urgent"?700:400,cursor:"pointer",whiteSpace:"nowrap"}}>🚨 Need One Today</button>

          <button onClick={()=>setTab("pro")} style={{background:"none",border:"none",color:"#4B4B4B",fontSize:13,cursor:"pointer",padding:"0 12px",fontFamily:"sans-serif"}}>List Your Business</button>

        RooFinder.online · Browse freely. No forms. No spam calls.

    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
