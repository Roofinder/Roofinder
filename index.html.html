<body>

<script type="text/babel">

  { score: 8,  priority: "HOT", address: "4408 Millbrook Rd", city: "Raleigh", owner: "Fletcher, James R", roofAge: 28, yearsOwned: 18.2, homeValue: 412000, weatherAlert: "Yes", reasons: "Aging roof | Long-term owner | Ideal home value | Owner-occupied | Weather-affected area" },
  { score: 7,  priority: "HOT", address: "2201 Creekside Dr", city: "Durham", owner: "Williams, Patricia A", roofAge: 26, yearsOwned: 14.3, homeValue: 385000, weatherAlert: "No",  reasons: "Aging roof | Long-term owner | Ideal home value | Owner-occupied" },
  { score: 6,  priority: "WARM", address: "915 Carriage Oaks Dr", city: "Raleigh", owner: "Johnson, Mark T", roofAge: 22, yearsOwned: 11.0, homeValue: 298000, weatherAlert: "Yes", reasons: "Aging roof | Mid-term owner | Mid-value home | Owner-occupied | Weather-affected area" },

  { street: "E Woodcroft Pkwy", city: "Durham", activity: 9, risk: "HIGH" },

  { street: "Village Manor Way",city: "Raleigh", activity: 2, risk: "MED"  },

// ── Logo ──────────────────────────────────────────────
const LogoIcon = ({ size = 36 }) => (
  <svg style={{ width:size, height:size, filter:"drop-shadow(0 0 8px rgba(200,16,46,0.5))", flexShrink:0 }} viewBox="0 0 100 100" fill="none">
    <defs>
      <linearGradient id="lr" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stopColor="#E8192E"/><stop offset="100%" stopColor="#8B0A1E"/>
      </linearGradient>
    </defs>
    <rect x="18" y="52" width="52" height="38" rx="2" fill="#2A2A2A"/>
    <rect x="38" y="66" width="14" height="24" rx="2" fill="#111"/>
    <polygon points="10,55 50,18 90,55" fill="url(#lr)"/>
    <circle cx="72" cy="38" r="18" fill="#0D0D0D" stroke={RED} strokeWidth="4"/>
    <line x1="85" y1="51" x2="96" y2="62" stroke={RED} strokeWidth="5" strokeLinecap="round"/>
    <line x1="67" y1="38" x2="77" y2="38" stroke={RED} strokeWidth="2" strokeLinecap="round"/>

);

// ── Score Badge ───────────────────────────────────────
const ScoreBadge = ({ score, priority }) => {
  const bg = priority === "HOT" ? "#7F1D1D" : priority === "WARM" ? "#78350F" : "#1F2937";
  const color = priority === "HOT" ? "#FCA5A5" : priority === "WARM" ? "#FCD34D" : "#9CA3AF";
  return (
    <div style={{ display:"flex", alignItems:"center", gap:6 }}>
      <div style={{ background:bg, color, borderRadius:6, padding:"3px 8px", fontSize:11, fontWeight:700, fontFamily:"sans-serif" }}>{priority}</div>
      <div style={{ background:"#1F2937", color:"#60A5FA", borderRadius:6, padding:"3px 8px", fontSize:11, fontWeight:700, fontFamily:"sans-serif" }}>{score}/10</div>
    </div>
  );
};

// ── Lead Preview Tab ──────────────────────────────────
const LeadPreviewTab = ({ onGetStarted }) => {
  const [activeFilter, setActiveFilter] = useState("All");
  const filters = ["All", "HOT", "WARM"];
  const shown = activeFilter === "All" ? sampleLeads : sampleLeads.filter(l => l.priority === activeFilter);

  return (
    <div style={{ maxWidth:1000, margin:"0 auto", padding:"32px 24px" }}>
      <div style={{ marginBottom:28, textAlign:"center" }}>
        <div style={{ fontSize:11, fontWeight:700, letterSpacing:"3px", color:RED, fontFamily:"sans-serif", textTransform:"uppercase", marginBottom:10 }}>Sample Data Preview</div>
        <h2 style={{ color:"#fff", fontFamily:"Georgia,serif", fontSize:28, fontWeight:700, margin:"0 0 10px" }}>This is what you're buying</h2>
        <p style={{ color:MUTED, fontFamily:"sans-serif", fontSize:14, lineHeight:1.7, maxWidth:560, margin:"0 auto" }}>
          Every lead is scored 1–10 using our proprietary scoring model. Real addresses. Real owners. Updated weekly. The methodology stays with us — the results are yours.
        </p>
      </div>

      {/* Filters */}
      <div style={{ display:"flex", gap:8, justifyContent:"center", marginBottom:24 }}>
        {filters.map(f => (
          <button key={f} onClick={() => setActiveFilter(f)} style={{ padding:"7px 20px", borderRadius:20, border:`1.5px solid ${activeFilter===f?RED:BORDER}`, background:activeFilter===f?RED:"transparent", color:activeFilter===f?"#fff":MUTED, fontSize:13, fontFamily:"sans-serif", fontWeight:700, cursor:"pointer" }}>{f}</button>
        ))}
      </div>

      {/* Lead cards */}
      <div style={{ display:"flex", flexDirection:"column", gap:12, marginBottom:32 }}>
        {shown.map((lead, i) => (
          <div key={i} style={{ background:CARD, border:`1px solid ${BORDER}`, borderRadius:12, padding:"16px 20px" }}>
            <div style={{ display:"flex", alignItems:"flex-start", justifyContent:"space-between", gap:16, flexWrap:"wrap" }}>
              <div style={{ flex:1 }}>
                <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:6, flexWrap:"wrap" }}>
                  <ScoreBadge score={lead.score} priority={lead.priority}/>
                  <span style={{ color:"#fff", fontSize:15, fontWeight:700, fontFamily:"sans-serif" }}>{lead.address}</span>
                  <span style={{ color:MUTED, fontSize:13, fontFamily:"sans-serif" }}>{lead.city}, NC</span>
                </div>
                <div style={{ color:"#9CA3AF", fontSize:12, fontFamily:"sans-serif", lineHeight:1.7 }}>
                  {lead.reasons.split(" | ").map((r, ri) => (
                    <span key={ri} style={{ display:"inline-block", background:"#1F2937", color:"#93C5FD", borderRadius:4, padding:"1px 7px", marginRight:5, marginBottom:3, fontSize:11 }}>✓ {r}</span>
                  ))}
                </div>
              </div>
              <div style={{ display:"flex", gap:20, flexShrink:0, flexWrap:"wrap" }}>
                {[
                  { label:"Roof Age", value:`${lead.roofAge} yrs` },
                  { label:"Owned", value:`${lead.yearsOwned} yrs` },
                  { label:"Value", value:`$${(lead.homeValue/1000).toFixed(0)}k` },
                  { label:"Weather Alert", value:lead.weatherAlert },
                ].map(s => (
                  <div key={s.label} style={{ textAlign:"center" }}>
                    <div style={{ color:"#fff", fontSize:14, fontWeight:700, fontFamily:"sans-serif" }}>{s.value}</div>
                    <div style={{ color:MUTED, fontSize:10, fontFamily:"sans-serif", textTransform:"uppercase", letterSpacing:"0.5px" }}>{s.label}</div>
                  </div>
                ))}
              </div>
            </div>
          </div>
        ))}
      </div>

      {/* High Activity Streets */}
      <div style={{ background:CARD, border:`1px solid ${BORDER}`, borderRadius:12, padding:"20px 24px", marginBottom:32 }}>
        <div style={{ fontSize:13, fontWeight:700, color:"#fff", fontFamily:"sans-serif", marginBottom:4 }}>🔥 High-Activity Streets</div>
        <div style={{ color:MUTED, fontSize:12, fontFamily:"sans-serif", marginBottom:16 }}>Our intelligence flags streets with concentrated roofing activity — knock the whole block while demand is hot.</div>
        <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
          {hotStreets.map((z, i) => (
            <div key={i} style={{ display:"flex", alignItems:"center", justifyContent:"space-between", padding:"10px 14px", background:"#1A1A1A", borderRadius:8 }}>
              <div>
                <span style={{ color:"#fff", fontSize:14, fontWeight:700, fontFamily:"sans-serif" }}>{z.street}</span>
                <span style={{ color:MUTED, fontSize:12, fontFamily:"sans-serif", marginLeft:10 }}>{z.city}</span>
              </div>
              <div style={{ display:"flex", gap:8, alignItems:"center" }}>
                <span style={{ color:MUTED, fontSize:12, fontFamily:"sans-serif" }}>Activity level: {z.activity}</span>
                <span style={{ background:z.risk==="HIGH"?"#7F1D1D":"#78350F", color:z.risk==="HIGH"?"#FCA5A5":"#FCD34D", fontSize:10, fontWeight:700, padding:"2px 8px", borderRadius:4, fontFamily:"sans-serif" }}>{z.risk} PRIORITY</span>
              </div>
            </div>
          ))}
        </div>
      </div>

      <div style={{ textAlign:"center" }}>
        <div style={{ color:MUTED, fontSize:13, fontFamily:"sans-serif", marginBottom:16 }}>
          This is a sample. The live feed has 2,000+ scored leads updated weekly across Raleigh, Durham, and Charlotte.
        </div>
        <button onClick={onGetStarted} style={{ background:RED, color:"#fff", border:"none", borderRadius:10, padding:"14px 40px", fontSize:16, fontFamily:"sans-serif", fontWeight:700, cursor:"pointer" }}>
          Get Access →
        </button>
      </div>
    </div>
  );
};

// ── Territory Map Tab ────────────────────────────────
const PocketMapTab = ({ onGetStarted }) => {
  const [selected, setSelected] = useState(null);

  const pockets = [
    { id:1,  name:"North Raleigh",         x:340, y:130, r:52, leads:312, hot:187, warm:125, price:5999, status:"available", zips:"27615, 27616, 27614" },
    { id:2,  name:"Midtown / North Hills",  x:320, y:222, r:44, leads:248, hot:143, warm:105, price:4499, status:"available", zips:"27609, 27612" },
    { id:3,  name:"Downtown / Inside Belt", x:368, y:298, r:36, leads:156, hot:89,  warm:67,  price:2999, status:"sold",      zips:"27601, 27603, 27604" },
    { id:4,  name:"East Raleigh",           x:455, y:285, r:44, leads:203, hot:118, warm:85,  price:3999, status:"available", zips:"27610, 27601" },
    { id:5,  name:"South Raleigh / Garner", x:388, y:378, r:48, leads:271, hot:156, warm:115, price:4999, status:"available", zips:"27603, 27606, 27529" },
    { id:6,  name:"West Raleigh / Cary",    x:228, y:308, r:50, leads:289, hot:167, warm:122, price:5499, status:"limited",   zips:"27607, 27606, 27513" },
    { id:7,  name:"Durham",                 x:140, y:155, r:46, leads:198, hot:112, warm:86,  price:3799, status:"available", zips:"27701, 27703, 27705" },
    { id:8,  name:"RTP / Morrisville",      x:192, y:248, r:38, leads:167, hot:94,  warm:73,  price:2999, status:"sold",      zips:"27560, 27519" },
  ];

  const statusColor = { available: RED, limited: "#F59E0B", sold: "#374151" };
  const statusLabel = { available: "AVAILABLE", limited: "1 SLOT LEFT", sold: "SOLD OUT" };
  const sel = pockets.find(p => p.id === selected);

  return (
    <div style={{ maxWidth:1100, margin:"0 auto", padding:"32px 24px" }}>
      <div style={{ textAlign:"center", marginBottom:28 }}>
        <div style={{ fontSize:11, fontWeight:700, letterSpacing:"3px", color:RED, fontFamily:"sans-serif", textTransform:"uppercase", marginBottom:10 }}>Territory Map</div>
        <h2 style={{ color:"#fff", fontFamily:"Georgia,serif", fontSize:26, margin:"0 0 8px" }}>Buy a pocket. Own the territory.</h2>
        <p style={{ color:MUTED, fontFamily:"sans-serif", fontSize:14, maxWidth:520, margin:"0 auto" }}>
          Each pocket is a ~5-mile zone with all scored leads inside it — exclusive to one contractor. Click a zone to see what's inside.
        </p>
      </div>

      <div style={{ display:"grid", gridTemplateColumns: sel ? "1fr 320px" : "1fr", gap:24, alignItems:"start" }}>

        {/* Map */}
        <div style={{ background:"#0D0D0D", border:`1px solid ${BORDER}`, borderRadius:16, overflow:"hidden", position:"relative" }}>
          <svg viewBox="0 0 600 500" style={{ width:"100%", display:"block" }}>
            {/* Background */}
            <rect width="600" height="500" fill="#0D0D0D"/>

            {/* Subtle road grid / highway lines */}
            {/* I-440 beltline — rough ellipse */}
            <ellipse cx="360" cy="295" rx="105" ry="85" fill="none" stroke="#1F2937" strokeWidth="6" strokeDasharray="0"/>
            {/* I-40 East-West */}
            <line x1="0" y1="330" x2="600" y2="315" stroke="#1F2937" strokeWidth="5"/>
            {/* US-1 / Capital Blvd — NE diagonal */}
            <line x1="370" y1="500" x2="420" y2="0" stroke="#1F2937" strokeWidth="3"/>
            {/* I-40 to Durham */}
            <line x1="80" y1="210" x2="300" y2="290" stroke="#1F2937" strokeWidth="5"/>
            {/* Glenwood Ave-ish north */}
            <line x1="330" y1="0" x2="345" y2="500" stroke="#1F2937" strokeWidth="2"/>
            {/* Wade Ave west */}
            <line x1="150" y1="300" x2="420" y2="295" stroke="#1F2937" strokeWidth="2"/>

            {/* Road labels */}
            <text x="82" y="304" fill="#374151" fontSize="9" fontFamily="sans-serif" transform="rotate(-8,82,304)">I-40</text>
            <text x="275" y="270" fill="#374151" fontSize="9" fontFamily="sans-serif" transform="rotate(-5,275,270)">I-40</text>
            <text x="300" y="338" fill="#374151" fontSize="9" fontFamily="sans-serif">I-440</text>
            <text x="408" y="200" fill="#374151" fontSize="9" fontFamily="sans-serif" transform="rotate(-83,408,200)">US-1</text>

            {/* City marker */}
            <circle cx="360" cy="295" r="5" fill="#4B5563"/>
            <text x="368" y="292" fill="#6B7280" fontSize="9" fontFamily="sans-serif">Raleigh</text>
            <circle cx="140" cy="152" r="5" fill="#4B5563"/>
            <text x="148" y="149" fill="#6B7280" fontSize="9" fontFamily="sans-serif">Durham</text>

            {/* Pocket circles */}
            {pockets.map(p => {
              const col = statusColor[p.status];
              const isSel = selected === p.id;
              const isSold = p.status === "sold";
              return (
                <g key={p.id} onClick={() => setSelected(isSel ? null : p.id)} style={{ cursor: isSold ? "default" : "pointer" }}>
                  {/* Glow ring for available */}
                  {!isSold && (
                    <circle cx={p.x} cy={p.y} r={p.r + 8} fill={col} opacity={isSel ? 0.18 : 0.06}/>
                  )}
                  {/* Main circle */}
                  <circle
                    cx={p.x} cy={p.y} r={p.r}
                    fill={isSold ? "rgba(30,30,30,0.6)" : `rgba(${col=== RED?"200,16,46":col==="#F59E0B"?"245,158,11":"55,65,81"},0.15)`}
                    stroke={isSel ? col : col}
                    strokeWidth={isSel ? 2.5 : 1.5}
                    strokeOpacity={isSold ? 0.3 : 0.8}
                    strokeDasharray={isSold ? "4 3" : "0"}
                  />
                  {/* Lead count */}
                  <text x={p.x} y={p.y - 7} textAnchor="middle" fill={isSold ? "#4B5563" : "#fff"} fontSize="15" fontWeight="700" fontFamily="sans-serif">
                    {p.leads}
                  </text>
                  <text x={p.x} y={p.y + 8} textAnchor="middle" fill={isSold ? "#374151" : MUTED} fontSize="9" fontFamily="sans-serif">
                    leads
                  </text>
                  {/* Name label */}
                  <text x={p.x} y={p.y + p.r + 14} textAnchor="middle" fill={isSold ? "#374151" : "#9CA3AF"} fontSize="9" fontFamily="sans-serif" fontWeight={isSel?"700":"400"}>
                    {p.name.length > 18 ? p.name.slice(0,17)+"…" : p.name}
                  </text>
                  {/* Status pill */}
                  {p.status === "sold" && (
                    <text x={p.x} y={p.y + p.r + 24} textAnchor="middle" fill="#374151" fontSize="8" fontFamily="sans-serif">SOLD OUT</text>
                  )}
                  {p.status === "limited" && (
                    <text x={p.x} y={p.y + p.r + 24} textAnchor="middle" fill="#F59E0B" fontSize="8" fontFamily="sans-serif" fontWeight="700">1 SLOT LEFT</text>
                  )}
                </g>
              );
            })}

            {/* North arrow */}
            <text x="558" y="30" fill="#374151" fontSize="11" fontFamily="sans-serif" fontWeight="700">N ↑</text>
          </svg>

          {/* Legend */}
          <div style={{ display:"flex", gap:20, padding:"12px 20px", borderTop:`1px solid ${BORDER}`, justifyContent:"center" }}>
            {[
              { col:RED,      label:"Available" },
              { col:"#F59E0B", label:"Limited" },
              { col:"#374151", label:"Sold Out" },
            ].map((l,i) => (
              <div key={i} style={{ display:"flex", alignItems:"center", gap:6 }}>
                <div style={{ width:10, height:10, borderRadius:"50%", background:l.col }}/>
                <span style={{ color:MUTED, fontSize:11, fontFamily:"sans-serif" }}>{l.label}</span>
              </div>
            ))}
            <span style={{ color:"#4B5563", fontSize:11, fontFamily:"sans-serif" }}>· Click a zone to see details</span>
          </div>
        </div>

        {/* Detail panel */}
        {sel && (
          <div style={{ background:CARD, border:`2px solid ${statusColor[sel.status]}`, borderRadius:16, padding:"24px 20px", position:"sticky", top:80 }}>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:16 }}>
              <div>
                <div style={{ color:"#fff", fontFamily:"Georgia,serif", fontSize:18, fontWeight:700, marginBottom:4 }}>{sel.name}</div>
                <span style={{ background: sel.status==="sold"?"#1F2937":sel.status==="limited"?"rgba(245,158,11,0.15)":"rgba(200,16,46,0.15)", color:statusColor[sel.status], fontSize:10, fontWeight:700, padding:"3px 10px", borderRadius:20, fontFamily:"sans-serif", letterSpacing:"0.5px" }}>
                  {statusLabel[sel.status]}
                </span>
              </div>
              <button onClick={() => setSelected(null)} style={{ background:"none", border:"none", color:MUTED, fontSize:18, cursor:"pointer", padding:0, lineHeight:1 }}>×</button>
            </div>

            <div style={{ color:MUTED, fontSize:12, fontFamily:"sans-serif", marginBottom:20 }}>Zip codes: {sel.zips}</div>

            {/* Lead breakdown */}
            <div style={{ background:"#0D0D0D", borderRadius:10, padding:16, marginBottom:20 }}>
              <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:12 }}>
                <span style={{ color:MUTED, fontSize:12, fontFamily:"sans-serif" }}>Total leads in pocket</span>
                <span style={{ color:"#fff", fontSize:20, fontWeight:700, fontFamily:"Georgia,serif" }}>{sel.leads}</span>
              </div>
              <div style={{ display:"flex", justifyContent:"space-between", marginBottom:8 }}>
                <span style={{ display:"flex", alignItems:"center", gap:6, color:"#FCA5A5", fontSize:13, fontFamily:"sans-serif" }}>
                  <span style={{ background:"rgba(200,16,46,0.2)", color:RED, padding:"1px 7px", borderRadius:10, fontSize:10, fontWeight:700 }}>HOT</span> {sel.hot} leads
                </span>
                <span style={{ color:"#FCA5A5", fontSize:13, fontFamily:"sans-serif", fontWeight:600 }}>${(sel.hot * 75).toLocaleString()} value</span>
              </div>
              <div style={{ display:"flex", justifyContent:"space-between" }}>
                <span style={{ display:"flex", alignItems:"center", gap:6, color:"#FCD34D", fontSize:13, fontFamily:"sans-serif" }}>
                  <span style={{ background:"rgba(252,211,77,0.15)", color:"#FCD34D", padding:"1px 7px", borderRadius:10, fontSize:10, fontWeight:700 }}>WARM</span> {sel.warm} leads
                </span>
                <span style={{ color:"#FCD34D", fontSize:13, fontFamily:"sans-serif", fontWeight:600 }}>${(sel.warm * 35).toLocaleString()} value</span>
              </div>
            </div>

            {/* Individual value vs pocket price */}
            <div style={{ background:"rgba(200,16,46,0.06)", border:"1px solid rgba(200,16,46,0.2)", borderRadius:10, padding:"12px 14px", marginBottom:20 }}>
              <div style={{ display:"flex", justifyContent:"space-between", marginBottom:6 }}>
                <span style={{ color:MUTED, fontSize:12, fontFamily:"sans-serif" }}>If bought individually</span>
                <span style={{ color:"#6B7280", fontSize:13, fontFamily:"sans-serif", textDecoration:"line-through" }}>${((sel.hot * 75) + (sel.warm * 35)).toLocaleString()}</span>
              </div>
              <div style={{ display:"flex", justifyContent:"space-between" }}>
                <span style={{ color:"#4ADE80", fontSize:13, fontFamily:"sans-serif", fontWeight:700 }}>Pocket price</span>
                <span style={{ color:"#4ADE80", fontSize:20, fontFamily:"Georgia,serif", fontWeight:700 }}>${sel.price.toLocaleString()}</span>
              </div>
              <div style={{ color:"#4ADE80", fontSize:11, fontFamily:"sans-serif", marginTop:6, textAlign:"right" }}>
                Save ${(((sel.hot * 75) + (sel.warm * 35)) - sel.price).toLocaleString()}
              </div>
