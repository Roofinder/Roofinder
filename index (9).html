const MessageModal = ({roofer, user, onClose, onSignup}) => {
  const [step, setStep] = useState(user ? "message" : "signup");
  const [name, setName] = useState("");
  const [email, setEmail] = useState("");
  const [msg, setMsg] = useState("");
  const [sent, setSent] = useState(false);
  const handleSignup = () => { if(!name.trim()||!email.trim()) return; onSignup({name:name.trim(),email:email.trim()}); setStep("message"); };
  const handleSend = async () => {
    if(!msg.trim()) return;
    try {
      await fetch("https://formspree.io/f/xnjroolp", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
          contractor: roofer.name,
          location: roofer.location,
          from_name: user?.name || name,
          from_email: user?.email || email,
          message: msg,
          _subject: `New RooFinder Lead — ${roofer.name}`,
        }),
      });
    } catch(e) { console.log(e); }
    setSent(true);
  };
  return (
    <div onClick={onClose} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.65)",zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center",padding:24}}>
      <div onClick={e=>e.stopPropagation()} style={{background:"#fff",borderRadius:16,width:"100%",maxWidth:420,boxShadow:"0 24px 60px rgba(0,0,0,0.3)",overflow:"hidden"}}>
        <div style={{background:"#1A1A1A",padding:"16px 20px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div><div style={{color:"#fff",fontWeight:700,fontSize:15}}>{roofer.name}</div><div style={{color:"#9CA3AF",fontSize:12}}>{roofer.location}</div></div>
          <button onClick={onClose} style={{background:"none",border:"none",color:"#9CA3AF",fontSize:22,cursor:"pointer"}}>×</button>
        </div>
        <div style={{padding:24}}>
          {sent ? (
            <div style={{textAlign:"center",padding:"16px 0"}}>
              <div style={{fontSize:44,marginBottom:10}}>✅</div>
              <div style={{fontSize:17,fontWeight:700,color:"#111",marginBottom:8}}>Message Sent!</div>
              <div style={{color:"#6B7280",fontSize:13,lineHeight:1.6,marginBottom:16}}>{roofer.name} will reply through RooFinder. No cold calls unless you want them.</div>
              <button onClick={onClose} style={{background:"#C8102E",color:"#fff",border:"none",borderRadius:8,padding:"11px 32px",fontSize:14,fontWeight:700,cursor:"pointer"}}>Done</button>
            </div>
          ) : step==="signup" ? (
            <>
              <div style={{fontSize:16,fontWeight:700,color:"#111",marginBottom:6}}>Quick account to send message</div>
              <div style={{color:"#6B7280",fontSize:13,lineHeight:1.6,marginBottom:16}}>Just name + email. No phone required. They reply here — <strong>no cold calls.</strong></div>
              <div style={{display:"flex",flexDirection:"column",gap:10,marginBottom:14}}>
                <input value={name} onChange={e=>setName(e.target.value)} placeholder="Your first name" style={{padding:"11px 14px",border:"1.5px solid #E5E0D8",borderRadius:8,fontSize:14,outline:"none",color:"#111"}}/>
                <input value={email} onChange={e=>setEmail(e.target.value)} placeholder="Email address" type="email" style={{padding:"11px 14px",border:"1.5px solid #E5E0D8",borderRadius:8,fontSize:14,outline:"none",color:"#111"}}/>
              </div>
              <button onClick={handleSignup} disabled={!name.trim()||!email.trim()} style={{width:"100%",background:name.trim()&&email.trim()?"#C8102E":"#E5E0D8",color:name.trim()&&email.trim()?"#fff":"#9CA3AF",border:"none",borderRadius:8,padding:"12px",fontSize:15,fontWeight:700,cursor:"pointer"}}>Continue →</button>
              <div style={{textAlign:"center",marginTop:10,color:"#9CA3AF",fontSize:11}}>🔒 We never sell your info</div>
            </>
          ) : (
            <>
              <div style={{fontSize:15,fontWeight:700,color:"#111",marginBottom:4}}>Message {roofer.name}</div>
              <div style={{color:"#6B7280",fontSize:13,marginBottom:12}}>They reply through RooFinder — no calls unless you want them.</div>
              <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:12}}>
                {["I think I have storm damage","I need a free inspection","I'd like a quote","I need emergency repair"].map(p=>(
                  <button key={p} onClick={()=>setMsg(p)} style={{background:msg===p?"#FEF2F2":"#F7F5F0",border:`1px solid ${msg===p?"#C8102E":"#E5E0D8"}`,color:msg===p?"#C8102E":"#4B4B4B",borderRadius:20,padding:"5px 10px",fontSize:11,cursor:"pointer"}}>{p}</button>
                ))}
              </div>
              <textarea value={msg} onChange={e=>setMsg(e.target.value)} placeholder="Add any details..." rows={3} style={{width:"100%",padding:"11px 14px",border:"1.5px solid #E5E0D8",borderRadius:8,fontSize:13,resize:"none",outline:"none",color:"#111",boxSizing:"border-box"}}/>
              <button onClick={handleSend} disabled={!msg.trim()} style={{width:"100%",marginTop:10,background:msg.trim()?"#C8102E":"#E5E0D8",color:msg.trim()?"#fff":"#9CA3AF",border:"none",borderRadius:8,padding:"12px",fontSize:15,fontWeight:700,cursor:"pointer"}}>Send Message</button>
              <div style={{textAlign:"center",marginTop:8,color:"#9CA3AF",fontSize:11}}>🔒 Your phone is never shared unless you choose</div>
            </>
          )}
        </div>
      </div>
    </div>
  );
};

const urgentSteps = [
  {key:"issue",question:"What's going on with your roof?",subtitle:"Pick the option that best describes your situation",options:[{label:"🌩️ Storm Damage",desc:"Hail, wind, or water damage"},{label:"🔧 Repair Needed",desc:"Leak, missing shingles, or damage"},{label:"🏠 Full Replacement",desc:"Old roof or major damage"},{label:"🔍 Inspection",desc:"Want someone to take a look"}]},
  {key:"insurance",question:"Will you be using insurance?",subtitle:"This helps us match you with the right contractor",options:[{label:"✅ Yes — filing a claim",desc:"I want help with the insurance process"},{label:"💳 No — paying out of pocket",desc:"I'll be paying directly"},{label:"🤔 Not sure yet",desc:"I need to find out if I'm covered"}]},
  {key:"timeline",question:"How soon do you need this done?",subtitle:"We'll prioritize accordingly",options:[{label:"🚨 Emergency — today",desc:"Active leak or major damage"},{label:"📅 This week",desc:"Soon but not emergency"},{label:"🗓️ Within a month",desc:"Planning ahead"},{label:"⏳ Just getting quotes",desc:"No rush, exploring options"}]},
  {key:"contact",question:"How would you like to be contacted?",subtitle:"You control this — pick what's comfortable",options:[{label:"💬 Text message",desc:"Quick and easy"},{label:"📧 Email only",desc:"No calls, ever"},{label:"📞 Phone call is fine",desc:"I'm okay with a call"},{label:"📱 Any of the above",desc:"Whatever's fastest"}]},
];

const UrgentFlow = ({onBack}) => {
  const [step,setStep] = useState(0);
  const [answers,setAnswers] = useState({});
  const [name,setName] = useState("");
  const [email,setEmail] = useState("");
  const [zip,setZip] = useState("");
  const [submitted,setSubmitted] = useState(false);
  const current = urgentSteps[step];
  const isLast = step===urgentSteps.length-1;
  const handleOption = (label) => { const a={...answers,[current.key]:label}; setAnswers(a); if(!isLast) setTimeout(()=>setStep(step+1),220); };
  const allAnswered = Object.keys(answers).length===urgentSteps.length;
  if(submitted) return (
    <div style={{maxWidth:520,margin:"0 auto",padding:"60px 24px",textAlign:"center"}}>
      <div style={{fontSize:56,marginBottom:16}}>🎉</div>
      <h2 style={{fontSize:24,fontWeight:700,color:"#111",marginBottom:10}}>You're all set!</h2>
      <p style={{color:"#6B7280",fontSize:15,lineHeight:1.7,marginBottom:24}}>We're matching you with verified roofers based on your needs. They'll reach out via your preferred contact method — no surprises.</p>
      <button onClick={onBack} style={{background:"#C8102E",color:"#fff",border:"none",borderRadius:8,padding:"12px 32px",fontSize:14,fontWeight:700,cursor:"pointer"}}>Browse Contractors</button>
    </div>
  );
  const wantsText = answers.contact && (answers.contact.includes("Text") || answers.contact.includes("Phone") || answers.contact.includes("Any"));
  const [phone, setPhone] = useState("");
  const canSubmit = name.trim() && email.trim() && zip.trim() && (!wantsText || phone.trim());
  if(allAnswered) return (
    <div style={{maxWidth:480,margin:"0 auto",padding:"40px 24px"}}>
      <button onClick={()=>{setStep(3);const a={...answers};delete a.contact;setAnswers(a);}} style={{background:"none",border:"none",color:"#9CA3AF",fontSize:13,cursor:"pointer",marginBottom:24,padding:0}}>← Back</button>
      <h2 style={{fontSize:22,fontWeight:700,color:"#111",marginBottom:6}}>Almost done</h2>
      <p style={{color:"#6B7280",fontSize:14,marginBottom:24,lineHeight:1.6}}>Last step — where should contractors reach you? No spam. You're in control.</p>
      <div style={{display:"flex",flexDirection:"column",gap:12,marginBottom:20}}>
        <input value={name} onChange={e=>setName(e.target.value)} placeholder="Your first name" style={{padding:"12px 14px",border:"1.5px solid #E5E0D8",borderRadius:8,fontSize:14,outline:"none",color:"#111"}}/>
        <input value={email} onChange={e=>setEmail(e.target.value)} placeholder="Email address" type="email" style={{padding:"12px 14px",border:"1.5px solid #E5E0D8",borderRadius:8,fontSize:14,outline:"none",color:"#111"}}/>
        {wantsText && (
          <input value={phone} onChange={e=>setPhone(e.target.value)} placeholder="Phone number" type="tel" style={{padding:"12px 14px",border:"1.5px solid #C8102E",borderRadius:8,fontSize:14,outline:"none",color:"#111",background:"#FEF2F2"}}/>
        )}
        <input value={zip} onChange={e=>setZip(e.target.value)} placeholder="Zip code" style={{padding:"12px 14px",border:"1.5px solid #E5E0D8",borderRadius:8,fontSize:14,outline:"none",color:"#111"}}/>
      </div>
      {wantsText && (
        <div style={{background:"#FEF2F2",border:"1px solid #FECACA",borderRadius:8,padding:"10px 14px",marginBottom:16,fontSize:12,color:"#991B1B"}}>
          🔒 Your number is only shared with the contractor you choose — never sold or spammed.
        </div>
      )}
      <button onClick={()=>setSubmitted(true)} disabled={!canSubmit} style={{width:"100%",background:canSubmit?"#C8102E":"#E5E0D8",color:canSubmit?"#fff":"#9CA3AF",border:"none",borderRadius:8,padding:"14px",fontSize:16,fontWeight:700,cursor:canSubmit?"pointer":"default"}}>Find Me a Contractor →</button>
    </div>
  );
  return (
    <div style={{maxWidth:480,margin:"0 auto",padding:"40px 24px"}}>
      {step>0&&<button onClick={()=>setStep(step-1)} style={{background:"none",border:"none",color:"#9CA3AF",fontSize:13,cursor:"pointer",marginBottom:24,padding:0}}>← Back</button>}
      <div style={{background:"#F0EDE8",borderRadius:20,height:4,marginBottom:28}}><div style={{background:"#C8102E",borderRadius:20,height:4,width:`${((step+1)/urgentSteps.length)*100}%`,transition:"width 0.3s"}}/></div>
      <div style={{fontSize:11,color:"#C8102E",fontWeight:700,letterSpacing:"1px",marginBottom:8}}>STEP {step+1} OF {urgentSteps.length}</div>
      <h2 style={{fontSize:22,fontWeight:700,color:"#111",marginBottom:6}}>{current.question}</h2>
      <p style={{color:"#6B7280",fontSize:14,marginBottom:24,lineHeight:1.5}}>{current.subtitle}</p>
      <div style={{display:"flex",flexDirection:"column",gap:10}}>
        {current.options.map(opt=>{
          const selected=answers[current.key]===opt.label;
          return <button key={opt.label} onClick={()=>handleOption(opt.label)} style={{background:selected?"#FEF2F2":"#fff",border:`2px solid ${selected?"#C8102E":"#E5E0D8"}`,borderRadius:10,padding:"14px 16px",display:"flex",alignItems:"center",gap:14,cursor:"pointer",textAlign:"left",transition:"all 0.15s"}}>
            <div style={{fontSize:22}}>{opt.label.split(" ")[0]}</div>
            <div><div style={{fontSize:14,fontWeight:700,color:selected?"#C8102E":"#111"}}>{opt.label.split(" ").slice(1).join(" ")}</div><div style={{fontSize:12,color:"#9CA3AF",marginTop:2}}>{opt.desc}</div></div>
            {selected&&<div style={{marginLeft:"auto",color:"#C8102E",fontSize:18}}>✓</div>}
          </button>;
        })}
      </div>
    </div>
  );
};

const BrowseTab = ({user, onSignup, onUrgent}) => {
  const [search,setSearch] = useState("");
  const [zip,setZip] = useState("");
  const [specialty,setSpecialty] = useState("All");
  const [verifiedOnly,setVerifiedOnly] = useState(false);
  const [sortBy,setSortBy] = useState("rating");
  const [selected,setSelected] = useState(null);
  const [messaging,setMessaging] = useState(null);
  const [smallBizOnly, setSmallBizOnly] = useState(false);
  const [newCompanyOnly, setNewCompanyOnly] = useState(false);

  const featured = roofers.find(r => r.featured);
  const others = roofers.filter(r => !r.featured);

  const filterFn = r => {
    const q = search.toLowerCase();
    const matchSearch = r.name.toLowerCase().includes(q) || r.location.toLowerCase().includes(q);
    const matchSpecialty = specialty === "All" || r.specialties.includes(specialty);
    const matchVerified = !verifiedOnly || r.verified;
    const matchSmall = !smallBizOnly || r.smallBusiness;
    const matchNew = !newCompanyOnly || r.newCompany;
    const matchZip = !zip.trim() || (r.zips && r.zips.includes(zip.trim()));
    return matchSearch && matchSpecialty && matchVerified && matchSmall && matchNew && matchZip;
  };

  const filtered = others.filter(filterFn).sort((a,b)=>sortBy==="rating"?b.rating-a.rating:sortBy==="reviews"?b.reviews-a.reviews:b.yearsExp-a.yearsExp);
  const showFeatured = filterFn(featured);
  return (
    <>
      {messaging&&<MessageModal roofer={messaging} user={user} onClose={()=>setMessaging(null)} onSignup={onSignup}/>}
      <div style={{background:"linear-gradient(135deg,#1A1A1A 0%,#2D1515 100%)",padding:"28px 24px",borderBottom:"3px solid #C8102E"}}>
        <div style={{maxWidth:1000,margin:"0 auto"}}>
          <p style={{color:"#9CA3AF",fontSize:13,margin:"0 0 14px"}}>Browse freely. Message who you want. <strong style={{color:"#fff"}}>No spam calls, ever.</strong></p>
          <div style={{display:"flex",gap:10,flexWrap:"wrap",marginBottom:14}}>
            <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search by name or city..." style={{flex:2,minWidth:160,background:"#fff",border:"none",borderRadius:8,padding:"11px 16px",fontSize:14,outline:"none",color:"#111"}}/>
            <input value={zip} onChange={e=>setZip(e.target.value)} placeholder="📍 Zip code" maxLength={5} style={{flex:1,minWidth:100,maxWidth:130,background:"#fff",border:"none",borderRadius:8,padding:"11px 16px",fontSize:14,outline:"none",color:"#111"}}/>
            <select value={sortBy} onChange={e=>setSortBy(e.target.value)} style={{background:"#2A2A2A",color:"#E5E5E5",border:"1px solid #3A3A3A",borderRadius:8,padding:"11px 14px",fontSize:13,cursor:"pointer"}}>
              <option value="rating">Top Rated</option><option value="reviews">Most Reviewed</option><option value="experience">Most Experience</option>
            </select>
          </div>
          <div style={{background:"rgba(200,16,46,0.12)",border:"1px solid rgba(200,16,46,0.3)",borderRadius:10,padding:"12px 16px",display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:10}}>
            <div><div style={{color:"#fff",fontSize:14,fontWeight:700}}>🚨 Need someone fast?</div><div style={{color:"#FCA5A5",fontSize:12,marginTop:2}}>Answer 4 questions and we'll match you with the right contractor.</div></div>
            <button onClick={onUrgent} style={{background:"#C8102E",color:"#fff",border:"none",borderRadius:8,padding:"9px 18px",fontSize:13,fontWeight:700,cursor:"pointer",whiteSpace:"nowrap"}}>Need One Today →</button>
          </div>
        </div>
      </div>
      <div style={{maxWidth:1000,margin:"0 auto",padding:"24px"}}>
        <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:20}}>
          {allSpecialties.map(s=><button key={s} onClick={()=>setSpecialty(s)} style={{padding:"6px 14px",borderRadius:20,border:`1.5px solid ${specialty===s?"#C8102E":"#D1C9BB"}`,background:specialty===s?"#C8102E":"#fff",color:specialty===s?"#fff":"#4B4B4B",fontSize:12,cursor:"pointer",fontWeight:specialty===s?700:400}}>{s}</button>)}
          <button onClick={()=>setSmallBizOnly(!smallBizOnly)} style={{padding:"6px 14px",borderRadius:20,border:`1.5px solid ${smallBizOnly?"#D97706":"#D1C9BB"}`,background:smallBizOnly?"#D97706":"#fff",color:smallBizOnly?"#fff":"#4B4B4B",fontSize:12,cursor:"pointer",fontWeight:smallBizOnly?700:400}}>🏘️ Small Business</button>
          <button onClick={()=>setNewCompanyOnly(!newCompanyOnly)} style={{padding:"6px 14px",borderRadius:20,border:`1.5px solid ${newCompanyOnly?"#7C3AED":"#D1C9BB"}`,background:newCompanyOnly?"#7C3AED":"#fff",color:newCompanyOnly?"#fff":"#4B4B4B",fontSize:12,cursor:"pointer",fontWeight:newCompanyOnly?700:400}}>🆕 New & Hungry</button>
          <button onClick={()=>setVerifiedOnly(!verifiedOnly)} style={{padding:"6px 14px",borderRadius:20,border:`1.5px solid ${verifiedOnly?"#059669":"#D1C9BB"}`,background:verifiedOnly?"#059669":"#fff",color:verifiedOnly?"#fff":"#4B4B4B",fontSize:12,cursor:"pointer",marginLeft:"auto"}}>✓ Verified Only</button>
        </div>
        <div style={{color:"#9CA3AF",fontSize:12,marginBottom:16}}>{(showFeatured ? 1 : 0) + filtered.length} contractors found {zip && `near ${zip}`}</div>

        {/* Featured Card */}
        {showFeatured && featured && (
          <div style={{marginBottom:20}}>
            <div style={{fontSize:10,fontWeight:700,letterSpacing:"3px",color:"#C8102E",textTransform:"uppercase",marginBottom:8}}>⭐ Featured Contractor</div>
            <div onClick={()=>setSelected(selected?.id===featured.id?null:featured)} style={{background:"linear-gradient(135deg,#1A0A0A 0%,#1A1A1A 100%)",borderRadius:14,border:`2px solid ${selected?.id===featured.id?"#C8102E":"#C8102E"}`,boxShadow:"0 8px 40px rgba(200,16,46,0.2)",cursor:"pointer",overflow:"hidden",position:"relative"}}>
              <div style={{position:"absolute",top:0,left:0,right:0,height:3,background:"linear-gradient(90deg,#C8102E,#FF4560,#C8102E)"}}/>
              <div style={{background:"#1A1A1A",padding:"12px 18px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <div style={{display:"flex",gap:6,flexWrap:"wrap",alignItems:"center"}}>
                  <span style={{background:"#C8102E",color:"#fff",fontSize:10,padding:"3px 10px",borderRadius:20,fontWeight:700}}>⭐ FEATURED</span>
                  {featured.badges.map(b=><Badge key={b} label={b}/>)}
                </div>
                <span style={{color:"#34D399",fontSize:10,fontWeight:700}}>✓ VERIFIED</span>
              </div>
              <div style={{padding:"18px",display:"flex",gap:20,flexWrap:"wrap"}}>
                <div style={{flex:2,minWidth:200}}>
                  <div style={{fontSize:20,fontWeight:700,color:"#fff",marginBottom:2}}>{featured.name}</div>
                  <div style={{color:"#9CA3AF",fontSize:12,marginBottom:12}}>{featured.owner} · {featured.location}</div>
                  <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:14}}><Stars rating={featured.rating}/><span style={{fontWeight:700,fontSize:15,color:"#fff"}}>{featured.rating}</span><span style={{color:"#9CA3AF",fontSize:12}}>({featured.reviews} reviews)</span></div>
                  <div style={{display:"flex",gap:5,flexWrap:"wrap",marginBottom:14}}>{featured.specialties.map(s=><span key={s} style={{background:"rgba(200,16,46,0.15)",color:"#FCA5A5",fontSize:11,padding:"3px 10px",borderRadius:20}}>{s}</span>)}</div>
                  {selected?.id===featured.id && <p style={{color:"#9CA3AF",fontSize:13,lineHeight:1.7,marginBottom:14}}>{featured.bio}</p>}
                </div>
                <div style={{flex:1,minWidth:160}}>
                  <div style={{display:"flex",background:"rgba(255,255,255,0.05)",borderRadius:8,overflow:"hidden",marginBottom:12}}>
                    {[{v:`${featured.yearsExp}yr`,l:"Exp"},{v:featured.jobsDone,l:"Jobs"},{v:featured.responseTime,l:"Response"}].map((s,i)=>(
                      <div key={i} style={{flex:1,padding:"8px 4px",textAlign:"center",borderRight:i<2?"1px solid rgba(255,255,255,0.1)":"none"}}>
                        <div style={{fontSize:12,fontWeight:700,color:"#fff"}}>{s.v}</div><div style={{fontSize:10,color:"#6B7280"}}>{s.l}</div>
                      </div>
                    ))}
                  </div>
                  {selected?.id===featured.id ? (
                    <button onClick={e=>{e.stopPropagation();setMessaging(featured);}} style={{width:"100%",background:"#C8102E",color:"#fff",border:"none",borderRadius:8,padding:"12px 0",fontSize:14,fontWeight:700,cursor:"pointer"}}>💬 Send Message</button>
                  ) : (
                    <div style={{color:"#C8102E",fontSize:12,fontWeight:600,textAlign:"center",marginTop:8}}>Tap to view & message →</div>
                  )}
                </div>
              </div>
            </div>
          </div>
        )}

        {/* Regular grid */}
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(290px,1fr))",gap:16}}>
          {filtered.map(r=>(
            <div key={r.id} onClick={()=>setSelected(selected?.id===r.id?null:r)} style={{background:"#fff",borderRadius:12,border:`2px solid ${selected?.id===r.id?"#C8102E":"transparent"}`,boxShadow:selected?.id===r.id?"0 8px 30px rgba(200,16,46,0.12)":"0 2px 12px rgba(0,0,0,0.07)",cursor:"pointer",transition:"all 0.2s",overflow:"hidden"}}>
              <div style={{background:"#1A1A1A",padding:"10px 14px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>{r.badges.slice(0,2).map(b=><Badge key={b} label={b}/>)}</div>
                {r.verified&&<span style={{color:"#34D399",fontSize:10,fontWeight:700}}>✓ VERIFIED</span>}
              </div>
              <div style={{padding:"14px"}}>
                <div style={{fontSize:16,fontWeight:700,color:"#111",marginBottom:2}}>{r.name}</div>
                <div style={{color:"#6B7280",fontSize:12,marginBottom:10}}>{r.owner} · {r.location}</div>
                <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:12}}><Stars rating={r.rating}/><span style={{fontWeight:700,fontSize:14,color:"#111"}}>{r.rating}</span><span style={{color:"#9CA3AF",fontSize:12}}>({r.reviews})</span></div>
                <div style={{display:"flex",background:"#F7F5F0",borderRadius:8,overflow:"hidden",marginBottom:12}}>
                  {[{v:`${r.yearsExp}yr`,l:"Exp"},{v:r.jobsDone,l:"Jobs"},{v:r.responseTime,l:"Response"}].map((s,i)=>(
                    <div key={i} style={{flex:1,padding:"7px 4px",textAlign:"center",borderRight:i<2?"1px solid #E5E0D8":"none"}}>
                      <div style={{fontSize:12,fontWeight:700,color:"#111"}}>{s.v}</div><div style={{fontSize:10,color:"#9CA3AF"}}>{s.l}</div>
                    </div>
                  ))}
                </div>
                <div style={{display:"flex",gap:5,flexWrap:"wrap",marginBottom:12}}>{r.specialties.map(s=><span key={s} style={{background:"#F0EDE8",color:"#6B6055",fontSize:11,padding:"3px 8px",borderRadius:20}}>{s}</span>)}</div>
                {selected?.id===r.id ? (
                  <div style={{borderTop:"1px solid #F0EDE8",paddingTop:14}}>
                    <p style={{color:"#4B4B4B",fontSize:13,lineHeight:1.7,marginBottom:14}}>{r.bio}</p>
                    <div style={{fontSize:11,color:"#9CA3AF",marginBottom:14}}>License: {r.license}</div>
                    <div style={{display:"flex",gap:8}}>
                      <button onClick={e=>{e.stopPropagation();setMessaging(r);}} style={{flex:1,background:"#C8102E",color:"#fff",border:"none",borderRadius:8,padding:"11px 0",fontSize:14,fontWeight:700,cursor:"pointer"}}>💬 Send Message</button>
                    </div>
                    <div style={{marginTop:8,fontSize:11,color:"#9CA3AF",textAlign:"center"}}>📵 Contact is handled through RooFinder — no spam calls</div>
                  </div>
                ) : <div style={{color:"#C8102E",fontSize:12,fontWeight:600}}>Tap to view & message →</div>}
              </div>
            </div>
          ))}
        </div>
      </div>
    </>
  );
};

      <div style={{background:"#1A1A1A",padding:"0 24px",position:"sticky",top:0,zIndex:100,boxShadow:"0 2px 20px rgba(0,0,0,0.3)"}}>

            <button onClick={()=>setTab("urgent")} style={{padding:"7px 14px",borderRadius:7,border:"none",background:tab==="urgent"?"#C8102E":"transparent",color:tab==="urgent"?"#fff":"#9CA3AF",fontSize:12,fontWeight:tab==="urgent"?700:400,cursor:"pointer",whiteSpace:"nowrap"}}>🚨 Need One Today</button>

                <button onClick={()=>{setUser(null);setShowUserMenu(false);}} style={{width:"100%",background:"none",border:"none",padding:"10px 16px",fontSize:13,color:"#C8102E",cursor:"pointer",textAlign:"left"}}>Sign Out</button>
              </div>

          </div>

      </div>
