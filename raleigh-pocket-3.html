var isManager = false;
var statuses = {};
var hidden   = {};
var deleted  = {};
var currentFilter = 'all';
var unsubscribe = null;

// ── Auth ─────────────────────────────────────────────────────────
function tryLogin() {
  var val = document.getElementById('code-input').value.trim().toUpperCase();
  if (val === MANAGER_CODE) { isManager = true; launchPortal(); }
  else if (val === CLIENT_CODE) { isManager = false; launchPortal(); }
  else { document.getElementById('login-err').style.display = 'block'; }
}

function launchPortal() {
  document.getElementById('login').style.display = 'none';
  document.getElementById('portal').style.display = 'block';
  var badge = document.getElementById('mode-badge');
  if (isManager) {
    badge.textContent = 'MANAGER'; badge.className = 'nav-mode manager';
    document.getElementById('manager-bar').style.display = 'block';
    document.getElementById('th-actions').style.display = '';
    document.getElementById('hidden-filter-btn').style.display = '';
  } else {
    badge.textContent = 'CONTRACTOR'; badge.className = 'nav-mode contractor';
  }
  startSync();
}

// ── Firebase sync ─────────────────────────────────────────────────
function startSync() {
  unsubscribe = pocketDoc.onSnapshot(function(doc) {
    if (doc.exists) {
      var d = doc.data();
      statuses = d.statuses || {};
      hidden   = d.hidden   || {};
      deleted  = d.deleted  || {};
    }
    updateSubtitle();
    renderTable();
    updateStats();
    updateMgrCount();
  }, function(err) {
    console.warn('Sync error:', err);
  });
}

function saveField(field, value) {
  var update = {};
  update[field] = value;
  pocketDoc.set(update, { merge: true }).catch(function(e){ console.warn(e); });
}

// ── UI ────────────────────────────────────────────────────────────
function updateSubtitle() {
  var el = document.getElementById('portal-sub');
  if (isManager) {
    el.textContent = LEADS.filter(function(_,i){ return !deleted[i]; }).length + ' total leads · Raleigh, NC · Manager view';
  } else {
    el.textContent = LEADS.filter(function(_,i){ return !deleted[i] && !hidden[i]; }).length + ' prequalified leads · Raleigh, NC · Exclusive to you';
  }
}

function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(function(b){ b.classList.remove('active'); });
  if (btn) btn.classList.add('active');
  renderTable();
}

function fmtValue(v) {
  var n = parseInt(v);
  if (isNaN(n)) return v;
  if (n >= 1000000) return '$' + (n/1000000).toFixed(2) + 'M';
  return '$' + Math.round(n/1000) + 'K';
}

function renderTable() {
  var search = document.getElementById('search').value.toLowerCase();
  var rows = [];
  LEADS.forEach(function(l, i) {
    if (deleted[i]) return;
    var isHid = !!hidden[i];
    var s = statuses[i] || 'new';
    if (!isManager && isHid) return;
    if (currentFilter === 'knocked' && s !== 'knocked') return;
    if (currentFilter === 'interested' && s !== 'interested') return;
    if (currentFilter === 'not_knocked' && (s === 'knocked' || s === 'closed')) return;
    if (currentFilter === 'hidden' && !isHid) return;
    if (search && !l.owner.toLowerCase().includes(search) && !l.address.toLowerCase().includes(search)) return;
    rows.push({l:l, i:i, s:s, isHid:isHid});
  });
  document.getElementById('count-tag').textContent = rows.length + ' leads';
  var tbody = document.getElementById('lead-tbody');
  tbody.innerHTML = rows.map(function(r) {
    var l=r.l, i=r.i, s=r.s;
    var mapsUrl = 'https://www.google.com/maps?q=' + encodeURIComponent(l.address + ', ' + l.city + ', NC');
    var owner = l.owner.split(',')[0].trim();
    var hideLabel = r.isHid ? '\u{1F441} Show' : 'Hide';
    var hideCls = 'hide-btn' + (r.isHid ? ' is-hidden' : '');
    var rowCls = r.isHid ? ' class="is-hidden"' : '';
    var statusCell = isManager
      ? '<td><span style="color:#555;font-size:11px">—</span></td>'
      : '<td><select class="status-select ' + s + '" onchange="setStatus(' + i + ',this)">'
        + '<option value="new"' + (s==="new"?" selected":"") + '>Not Knocked</option>'
        + '<option value="knocked"' + (s==="knocked"?" selected":"") + '>Knocked</option>'
        + '<option value="interested"' + (s==="interested"?" selected":"") + '>Interested</option>'
        + '<option value="closed"' + (s==="closed"?" selected":"") + '>Closed</option>'
        + '<option value="skip"' + (s==="skip"?" selected":"") + '>Skip</option>'
        + '</select></td>';
    var actionsCell = isManager
      ? '<td><div class="action-btns">'
        + '<button class="' + hideCls + '" onclick="toggleHide(' + i + ')">' + hideLabel + '</button>'
        + '<button class="del-btn" onclick="deleteLead(' + i + ')">Delete</button>'
        + '</div></td>'
      : '';
    return '<tr' + rowCls + '>'
      + '<td style="color:#555;font-size:12px">' + (i+1) + '</td>'
      + '<td><div class="owner-name">' + owner + '</div><div class="address">' + l.address + ', ' + l.city + '</div></td>'
      + '<td><span class="value-num">' + fmtValue(l.value) + '</span></td>'
      + '<td style="color:#888">' + parseInt(l.sqft).toLocaleString() + '</td>'
      + '<td style="color:#888">' + l.year_built + '</td>'
      + '<td><a class="view-btn" href="' + mapsUrl + '" target="_blank">🛰 View Roof</a></td>'
      + statusCell + actionsCell + '</tr>';
  }).join('');
}

function setStatus(idx, sel) {
  statuses[idx] = sel.value;
  sel.className = 'status-select ' + sel.value;
  saveField('statuses', statuses);
  updateStats();
}

function toggleHide(idx) {
  if (hidden[idx]) delete hidden[idx]; else hidden[idx] = true;
  saveField('hidden', hidden);
}

function deleteLead(idx) {
  if (!confirm('Permanently delete this lead? This cannot be undone.')) return;
  deleted[idx] = true;
  if (hidden[idx]) delete hidden[idx];
  saveField('deleted', deleted);
  saveField('hidden', hidden);
}

function restoreAll() {
  hidden = {}; deleted = {};
  pocketDoc.set({ hidden: {}, deleted: {} }, { merge: true });
}

function updateStats() {
  var vis = LEADS.filter(function(_,i){ return !deleted[i] && (isManager || !hidden[i]); });
  document.getElementById('stat-total').textContent = vis.length;
  var kn=0, int=0;
  vis.forEach(function(l) {
    var i = LEADS.indexOf(l); var s = statuses[i] || 'new';
    if (s==='knocked'||s==='closed') kn++;
    if (s==='interested') int++;
  });
  document.getElementById('stat-knocked').textContent = kn;
  document.getElementById('stat-interested').textContent = int;
}

function updateMgrCount() {
  var el = document.getElementById('mgr-count');
  if (!el || !isManager) return;
  var h = Object.keys(hidden).length;
  var d = Object.keys(deleted).length;
  var parts = [];
  if (h) parts.push(h + ' hidden');
  if (d) parts.push(d + ' deleted');
  el.textContent = parts.join(' · ');
}
</script>
